pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url "https://artifactory-external.vkpartner.ru/artifactory/maven-rustore-exposed" // Assets/RustoreSDK/Editor/Common/CoreClientDependencies.xml:7
        }
        maven {
            url "https://nexus-external.vkteam.ru/repository/maven-rustore-exposed" // Assets/RustoreSDK/Editor/PayClient/PayClientDependencies.xml:7
        }
        maven {
            url "https://maven.google.com" // Assets/WordSearchTheme/Editor/ReviewDependencies.xml:10
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}

// ---------------------------------------------------------------------------
// Unity 2022.3 ships Android Gradle Plugin 7.4.2, whose dexer (D8) crashes on
// androidx.core 1.15+ ("D8: java.lang.NullPointerException" in core-1.15.0-runtime.jar).
// Libraries can pull 1.15 in transitively, so pin it to the newest version AGP 7.4 can dex.
// Remove this block after moving to Unity 6 (AGP 8.x).
gradle.beforeProject { p ->
    p.configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}
